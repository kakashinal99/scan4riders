name: Build Klang Valley map data

# Trusted branch pushes publish the verified PMTiles archive as a public release.
on:
  pull_request:
    paths:
      - "custom-map/data-pipeline/**"
      - ".github/workflows/build-klang-valley-map.yml"
  push:
    branches:
      - main
      - feature/custom-map-foundation
    paths:
      - "custom-map/data-pipeline/**"
      - ".github/workflows/build-klang-valley-map.yml"
  workflow_dispatch:
  schedule:
    - cron: "20 2 1 * *"

permissions:
  contents: write

concurrency:
  group: klang-valley-map-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout standalone map project
        uses: actions/checkout@v4
      - name: Install Osmium Tool
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool
      - name: Build and verify PMTiles
        working-directory: custom-map/data-pipeline
        run: |
          chmod +x build.sh
          ./build.sh
      - name: Upload versioned map archive
        uses: actions/upload-artifact@v4
        with:
          name: klang-valley-map-${{ github.run_id }}
          path: |
            custom-map/data-pipeline/output/klang-valley-basemap.pmtiles
            custom-map/data-pipeline/output/manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish public PMTiles release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: klang-valley-basemap-latest
          name: 4Riders Klang Valley Basemap (latest)
          body: |
            Automatically generated Klang Valley vector basemap from OpenStreetMap data.
            Source: Geofabrik Malaysia-Singapore-Brunei extract. License: ODbL-1.0.
            The PMTiles archive is served as a public release asset for HTTP byte-range access.
          files: |
            custom-map/data-pipeline/output/klang-valley-basemap.pmtiles
            custom-map/data-pipeline/output/manifest.json
          overwrite_files: true
          make_latest: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify published PMTiles browser range access
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        shell: bash
        run: |
          set -euo pipefail
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/klang-valley-basemap-latest/klang-valley-basemap.pmtiles"
          HEADERS="$(mktemp)"
          FINAL_HEADERS="$(mktemp)"
          BODY="$(mktemp)"
          trap 'rm -f "$HEADERS" "$FINAL_HEADERS" "$BODY"' EXIT
          STATUS="$(curl -sS -L --retry 3 -o "$BODY" -D "$HEADERS" -w '%{http_code}' \
            -H 'Origin: https://fourriders-custom-map.onrender.com' \
            -H 'Range: bytes=0-15' "$URL")"
          awk 'BEGIN { RS="\\r\\n\\r\\n" } NF { last=$0 } END { print last }' "$HEADERS" > "$FINAL_HEADERS"
          echo "Final HTTP status: $STATUS"
          cat "$FINAL_HEADERS"
          test "$STATUS" = "206" || { echo "PMTiles host did not honor byte-range requests"; exit 1; }
          test "$(wc -c < "$BODY" | tr -d ' ')" = "16" || { echo "PMTiles range response was not exactly 16 bytes"; exit 1; }
          grep -Fqi 'access-control-allow-origin: *' "$FINAL_HEADERS" || \
            grep -Fqi 'access-control-allow-origin: https://fourriders-custom-map.onrender.com' "$FINAL_HEADERS" || \
            { echo "PMTiles host does not allow the map app origin via CORS"; exit 1; }
          grep -Eqi '^access-control-expose-headers:.*content-range' "$FINAL_HEADERS" || \
            { echo "PMTiles host does not expose Content-Range to browser JavaScript"; exit 1; }
