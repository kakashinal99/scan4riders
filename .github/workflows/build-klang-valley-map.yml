name: Build Klang Valley map data

on:
  pull_request:
    paths:
      - "custom-map/data-pipeline/**"
      - ".github/workflows/build-klang-valley-map.yml"
  push:
    branches:
      - main
      - feature/custom-map-foundation
    paths:
      - "custom-map/data-pipeline/**"
      - ".github/workflows/build-klang-valley-map.yml"
  workflow_dispatch:
  schedule:
    - cron: "20 2 1 * *"

permissions:
  contents: write

concurrency:
  group: klang-valley-map-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout standalone map project
        uses: actions/checkout@v4
      - name: Install Osmium Tool
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool
      - name: Build and verify PMTiles
        working-directory: custom-map/data-pipeline
        run: |
          chmod +x build.sh
          ./build.sh
      - name: Upload versioned map archive
        uses: actions/upload-artifact@v4
        with:
          name: klang-valley-map-${{ github.run_id }}
          path: |
            custom-map/data-pipeline/output/klang-valley-basemap.pmtiles
            custom-map/data-pipeline/output/manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish public PMTiles release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: klang-valley-basemap-latest
          name: 4Riders Klang Valley Basemap (latest)
          body: |
            Automatically generated Klang Valley vector basemap from OpenStreetMap data.
            Source: Geofabrik Malaysia-Singapore-Brunei extract. License: ODbL-1.0.
            The PMTiles archive is served as a public release asset for HTTP byte-range access.
          files: |
            custom-map/data-pipeline/output/klang-valley-basemap.pmtiles
            custom-map/data-pipeline/output/manifest.json
          overwrite_files: true
          make_latest: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
