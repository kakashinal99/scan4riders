name: Custom Map Build

on:
  pull_request:
    paths:
      - "custom-map/**"
      - ".github/workflows/custom-map-build.yml"
  push:
    branches:
      - main
      - feature/custom-map-foundation
    paths:
      - "custom-map/**"
      - ".github/workflows/custom-map-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: custom-map
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: custom-map/package.json
      - name: Install dependencies
        run: npm install
      - name: Type-check and production build
        run: npm run build
