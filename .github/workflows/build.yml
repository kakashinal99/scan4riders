name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK platform and build tools
        run: sdkmanager --install "platforms;android-37" "build-tools;36.0.0"
      - name: Build debug APK
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          grep -E "^e: |error:" build.log | head -30 | while IFS= read -r l; do echo "::error::${l}"; done
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: 4riders-scan-apk
          path: app/build/outputs/apk/debug/app-debug.apk
