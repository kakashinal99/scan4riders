name: Build Klang Valley PMTiles

on:
  workflow_dispatch:
  push:
    branches:
      - feature/custom-map-foundation
    paths:
      - "custom-map/data-pipeline/**"
      - ".github/workflows/build-klang-valley-basemap.yml"
  schedule:
    - cron: "20 18 1 * *"

permissions:
  contents: write

concurrency:
  group: klang-valley-basemap
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Osmium Tool
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool curl

      - name: Build and verify Klang Valley archive
        run: |
          chmod +x custom-map/data-pipeline/build.sh
          bash custom-map/data-pipeline/build.sh

      - name: Publish verified PMTiles release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: klang-valley-basemap-latest
          name: 4Riders Klang Valley Basemap (latest)
          make_latest: true
          files: |
            custom-map/data-pipeline/output/klang-valley-basemap.pmtiles
            custom-map/data-pipeline/output/manifest.json
          fail_on_unmatched_files: true
          overwrite_files: true
