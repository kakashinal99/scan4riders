name: Android build
on:
  push:
    branches: [feature/native-android-map-shell]
    paths: ['android-app/**', '.github/workflows/android-build.yml']
  pull_request:
    branches: [feature/native-android-map-shell]
    paths: ['android-app/**', '.github/workflows/android-build.yml']
  workflow_dispatch:
jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: gradle -p android-app :app:assembleDebug --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: 4riders-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
