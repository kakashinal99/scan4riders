name: Deploy 4Riders PMTiles Proxy

on:
  push:
    branches:
      - feature/custom-map-foundation
    paths:
      - "custom-map/edge-proxy/**"
      - ".github/workflows/deploy-pmtiles-proxy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy custom-map/edge-proxy/worker.js --name 4riders-pmtiles-proxy --compatibility-date 2026-11-11
